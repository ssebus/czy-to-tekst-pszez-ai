<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Truth Studio - Detektor Tekstu PL/DE</title>
    <!-- Tesseract.js do odczytu zdjęć (OCR) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
    <!-- FontAwesome do ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card: #131c2e;
            --border: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --human: #10b981;
            --mixed: #f59e0b;
            --ai: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 { font-size: 1.4rem; margin: 0; color: var(--text); display: flex; align-items: center; gap: 10px; }
        h1 i { color: var(--accent); }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            padding-right: 48px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #090d16;
            color: var(--text);
            box-sizing: border-box;
            font-size: 1rem;
            resize: vertical;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .trash-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--ai);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .trash-btn:hover {
            background: var(--ai);
            color: white;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .file-card {
            background: #090d16;
            padding: 14px;
            border-radius: 12px;
            border: 1px dashed var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-card:hover { border-color: var(--accent); }
        .file-card i { font-size: 1.2rem; color: var(--accent); }
        .file-card label { cursor: pointer; font-size: 0.9rem; font-weight: 500; width: 100%; }
        input[type="file"] { display: none; }

        .btn-analyze {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-analyze:hover { opacity: 0.95; transform: translateY(-1px); }

        #loading {
            text-align: center;
            color: var(--accent);
            margin: 15px 0;
            font-weight: 500;
            display: none;
        }

        /* Wyniki */
        .results-section {
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
            display: none;
        }

        .export-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-export {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #090d16;
            color: var(--text);
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-export:hover { background: #131c2e; }

        .results-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 24px;
            background: #090d16;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .pie-chart {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: conic-gradient(var(--human) 0deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            position: relative;
        }

        .pie-chart::after {
            content: "";
            position: absolute;
            width: 86px;
            height: 86px;
            background: var(--card);
            border-radius: 50%;
        }

        .pie-value {
            position: relative;
            z-index: 2;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-human { background: var(--human); }
        .dot-mixed { background: var(--mixed); }
        .dot-ai { background: var(--ai); }

        .output-title { font-size: 1rem; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); }

        .highlighted-output {
            background: #090d16;
            padding: 20px;
            border-radius: 14px;
            line-height: 1.8;
            border: 1px solid var(--border);
            white-space: pre-wrap;
            font-size: 1rem;
        }

        .hl-human { background-color: rgba(16, 185, 129, 0.2); border-bottom: 2px solid var(--human); padding: 2px 4px; border-radius: 4px; }
        .hl-mixed { background-color: rgba(245, 158, 11, 0.25); border-bottom: 2px solid var(--mixed); padding: 2px 4px; border-radius: 4px; }
        .hl-ai { background-color: rgba(239, 68, 68, 0.25); border-bottom: 2px solid var(--ai); padding: 2px 4px; border-radius: 4px; }

        /* Style Drukarki / Pobierania PDF (Białe tło) */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }

            .container {
                box-shadow: none !important;
                border: none !important;
                background: #ffffff !important;
                max-width: 100% !important;
                padding: 0 !important;
            }

            .textarea-wrapper, .actions-grid, .btn-analyze, #loading, .export-bar, .trash-btn {
                display: none !important;
            }

            .results-section {
                display: block !important;
                border: none !important;
                padding: 0 !important;
            }

            .results-header {
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
                color: #000000 !important;
                page-break-inside: avoid;
            }

            .pie-chart::after {
                background: #ffffff !important;
            }

            .pie-value {
                color: #000000 !important;
            }

            .highlighted-output {
                background: #ffffff !important;
                border: 1px solid #e2e8f0 !important;
                color: #000000 !important;
                font-size: 11pt !important;
            }

            .hl-human { background-color: #d1fae5 !important; color: #065f46 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .hl-mixed { background-color: #fef3c7 !important; color: #92400e !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .hl-ai { background-color: #fee2e2 !important; color: #991b1b !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-shield-halved"></i> AI Truth Studio</h1>
        <span style="font-size: 0.85rem; color: var(--text-muted);">PL / DE Skaner</span>
    </div>
    
    <div class="textarea-wrapper">
        <textarea id="textInput" placeholder="Wpisz, wklej lub wgraj zdjęcie/plik tekstu po polsku lub niemiecku..."></textarea>
        <button class="trash-btn" onclick="clearText()" title="Wyczyść tekst"><i class="fa-solid fa-trash-can"></i></button>
    </div>

    <div class="actions-grid">
        <div class="file-card" onclick="document.getElementById('imageFile').click()">
            <i class="fa-solid fa-camera"></i>
            <label>Wgraj zdjęcie (OCR)</label>
            <input type="file" id="imageFile" accept="image/*" onchange="handleImage(this)">
        </div>
        <div class="file-card" onclick="document.getElementById('txtFile').click()">
            <i class="fa-solid fa-file-lines"></i>
            <label>Wgraj plik TXT</label>
            <input type="file" id="txtFile" accept=".txt" onchange="handleTxt(this)">
        </div>
    </div>

    <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Skanowanie zdjęcia (OCR)... Proszę czekać.</div>

    <button class="btn-analyze" onclick="analyzeText()"><i class="fa-solid fa-wand-magic-sparkles"></i> Analizuj Tekst</button>

    <div class="results-section" id="resultsSection">
        <div class="export-bar">
            <button class="btn-export" onclick="copyResults()"><i class="fa-regular fa-copy"></i> Kopiuj tekst</button>
            <button class="btn-export" onclick="window.print()"><i class="fa-solid fa-file-pdf"></i> Pobierz / Drukuj PDF</button>
        </div>

        <div class="results-header">
            <div class="pie-chart" id="pieChart">
                <div class="pie-value" id="pieCenterText">0%</div>
            </div>
            <div class="legend">
                <div class="legend-item"><div class="dot dot-human"></div> <span id="pHuman">Człowiek (< 35% AI): 0%</span></div>
                <div class="legend-item"><div class="dot dot-mixed"></div> <span id="pMixed">Może AI (35%-50%): 0%</span></div>
                <div class="legend-item"><div class="dot dot-ai"></div> <span id="pAi">Wysokie AI (> 50%): 0%</span></div>
            </div>
        </div>

        <div class="output-title">Podgląd tekstu z oznaczeniem fragmentów:</div>
        <div class="highlighted-output" id="highlightedOutput"></div>
    </div>
</div>

<script>
    function clearText() {
        document.getElementById('textInput').value = '';
        document.getElementById('resultsSection').style.display = 'none';
    }

    function handleTxt(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('textInput').value = e.target.result;
        };
        reader.readAsText(file);
    }

    function handleImage(input) {
        const file = input.files[0];
        if (!file) return;
        
        const loading = document.getElementById('loading');
        loading.style.display = 'block';

        Tesseract.recognize(
            file,
            'pol+deu',
            { logger: m => console.log(m) }
        ).then(({ data: { text } }) => {
            document.getElementById('textInput').value = text;
            loading.style.display = 'none';
        }).catch(err => {
            alert('Błąd OCR ze zdjęcia: ' + err);
            loading.style.display = 'none';
        });
    }

    function copyResults() {
        const text = document.getElementById('highlightedOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Skopiowano tekst raportu do schowka!');
        });
    }

    function analyzeText() {
        const text = document.getElementById('textInput').value.trim();
        if (!text) {
            alert('Wprowadź tekst lub wgraj plik!');
            return;
        }

        const sentences = text.match(/[^.!?]+[.!?]+(\s|$)/g) || [text];
        
        // Formuły i chwyty AI
        const aiPatterns = [
            /oczywiście/i, /mam dla ciebie/i, /królestwo/i, /morał tej baśni/i,
            /żył[ya]? długo i szczęśliwie/i, /siedmiogórami/i, /zaczarowany/i,
            /es war einmal/i, /moral von der geschicht/i, /drache/i, /und wenn sie nicht gestorben sind/i
        ];

        let totalAiWeight = 0;
        let htmlOutput = '';

        let humanSentences = 0;
        let mixedSentences = 0;
        let aiSentences = 0;

        sentences.forEach((sentence) => {
            let score = 0;
            
            // Sprawdzanie czy zdanie zawiera chwyty AI
            aiPatterns.forEach(pattern => {
                if (pattern.test(sentence)) score += 40;
            });

            // Analiza długości i symetrii zdań
            if (sentence.length > 60 && sentence.length < 140) score += 20;

            let cssClass = '';
            if (score >= 50) {
                cssClass = 'hl-ai';
                aiSentences++;
            } else if (score >= 30) {
                cssClass = 'hl-mixed';
                mixedSentences++;
            } else {
                cssClass = 'hl-human';
                humanSentences++;
            }

            totalAiWeight += score;
            htmlOutput += `<span class="${cssClass}">${escapeHtml(sentence)}</span> `;
        });

        const total = sentences.length;
        let overallAiPercentage = Math.min(100, Math.round((totalAiWeight / (total * 60)) * 100));
        
        // Dopasowanie do reguły progów
        if (aiSentences > humanSentences) {
            overallAiPercentage = Math.max(overallAiPercentage, 55);
        }

        const pieChart = document.getElementById('pieChart');
        const pieCenterText = document.getElementById('pieCenterText');

        let statusText = '';
        let color = '';

        if (overallAiPercentage > 50) {
            color = 'var(--ai)';
            statusText = `<span style="color:var(--ai);">AI (>50%)</span>`;
        } else if (overallAiPercentage >= 35) {
            color = 'var(--mixed)';
            statusText = `<span style="color:var(--mixed);">Może AI</span>`;
        } else {
            color = 'var(--human)';
            statusText = `<span style="color:var(--human);">Człowiek</span>`;
        }

        const deg = (overallAiPercentage / 100) * 360;
        pieChart.style.background = `conic-gradient(${color} 0deg ${deg}deg, #1e293b ${deg}deg 360deg)`;
        pieCenterText.innerHTML = `${overallAiPercentage}%<br><span style="font-size:0.75rem;">${statusText}</span>`;

        document.getElementById('pHuman').innerText = `Człowiek: ${Math.round((humanSentences/total)*100)}%`;
        document.getElementById('pMixed').innerText = `Może AI: ${Math.round((mixedSentences/total)*100)}%`;
        document.getElementById('pAi').innerText = `AI: ${Math.round((aiSentences/total)*100)}%`;

        document.getElementById('highlightedOutput').innerHTML = htmlOutput;
        document.getElementById('resultsSection').style.display = 'block';
    }

    function escapeHtml(string) {
        return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
